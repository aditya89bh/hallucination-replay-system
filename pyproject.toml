[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hallucination-replay-system"
version = "1.0.0rc1"
description = "Replay AI agent execution traces and analyze hallucination root causes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Aditya" }
]
keywords = [
  "ai-agents",
  "hallucination-analysis",
  "observability",
  "replay",
  "root-cause-analysis"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed"
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "structlog>=25.5,<26"
]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "mypy>=1.18",
  "pre-commit>=4.5",
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "httpx>=0.28,<1",
  "ruff>=0.15"
]

[project.urls]
Homepage = "https://github.com/aditya89bh/hallucination-replay-system"
Repository = "https://github.com/aditya89bh/hallucination-replay-system"
Issues = "https://github.com/aditya89bh/hallucination-replay-system/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hallucination_replay"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "BLE",
  "C4",
  "C90",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "Q",
  "RET",
  "RUF",
  "SIM",
  "T10",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.coverage.run]
branch = true
source = ["hallucination_replay"]
omit = [
  "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

