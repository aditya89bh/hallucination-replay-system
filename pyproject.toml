[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hallucination-replay-system"
version = "0.1.0"
description = "Replay AI agent execution traces and analyze hallucination root causes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Aditya" }
]
keywords = [
  "ai-agents",
  "hallucination-analysis",
  "observability",
  "replay",
  "root-cause-analysis"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed"
]
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "structlog>=25.5,<26"
]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "mypy>=1.18",
  "pre-commit>=4.5",
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "ruff>=0.15"
]

[project.urls]
Homepage = "https://github.com/aditya89bh/hallucination-replay-system"
Repository = "https://github.com/aditya89bh/hallucination-replay-system"
Issues = "https://github.com/aditya89bh/hallucination-replay-system/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hallucination_replay"]
